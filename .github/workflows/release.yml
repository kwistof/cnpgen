# Build and publish the cnpgen image to GitHub Container Registry on every push
# to main and on version tags, so `ghcr.io/kwistof/cnpgen:latest` stays current.
# Also pushes charts/cnpgen as an OCI artifact so it can be installed with
# `helm install cnpgen oci://ghcr.io/kwistof/charts/cnpgen --version <chart-version>`
# without cloning the repo.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          helm package charts/cnpgen
          helm push cnpgen-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
