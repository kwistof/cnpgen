{{- if eq .Values.audit.mode "verify-all" }}
{{- if .Values.target.label }}
{{- fail "target.label must be empty with audit.mode=verify-all: it checks every policy (target.namespace, if set, limits it to one namespace)" }}
{{- end }}
{{- else }}
{{- if not .Values.target.label }}
{{- fail "target.label is required, e.g. --set target.label=app.kubernetes.io/name=my-app" }}
{{- end }}
{{- if not .Values.target.namespace }}
{{- fail "target.namespace is required, e.g. --set target.namespace=my-namespace" }}
{{- end }}
{{- end }}
{{- if gt (int .Values.audit.settle) 0 }}
{{- fail "audit.settle isn't supported in the chart: it runs cnpgen as a long-lived Deployment, and a settling run would exit and be restarted in a loop. Leave audit.settle at 0 here and pull the policy files with `kubectl cp`; use the cnpgen CLI directly if you want a one-shot --settle run." }}
{{- end }}
{{- if not (has .Values.audit.mode (list "audit" "verify" "verify-all")) }}
{{- fail (printf "audit.mode must be \"audit\", \"verify\" or \"verify-all\", got %q" .Values.audit.mode) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cnpgen.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnpgen.labels" . | nindent 4 }}
spec:
  replicas: 1
  # cnpgen is a long-lived watcher, not a request handler: one pod, and don't
  # spin up a second during rollouts (two would fight over the same policy).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cnpgen.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cnpgen.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "cnpgen.serviceAccountName" . }}
      containers:
        - name: cnpgen
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # stdout isn't a TTY under `kubectl logs`, so cnpgen would otherwise
            # detect no color support; force it since terminals render the ANSI
            # codes fine regardless of TTY detection at the source.
            - name: FORCE_COLOR
              value: "1"
          args:
            {{- if eq .Values.audit.mode "verify-all" }}
            - verify
            - --all
            {{- if .Values.target.namespace }}
            - -n
            - {{ .Values.target.namespace | quote }}
            {{- end }}
            - -o
            - /out
            {{- else }}
            - {{ .Values.audit.mode }}
            - -l
            - {{ .Values.target.label | quote }}
            - -n
            - {{ .Values.target.namespace | quote }}
            - -o
            {{- end }}
            {{- if eq .Values.audit.mode "verify-all" }}
            {{- else if eq .Values.audit.mode "verify" }}
            - /out/missing-rules.yaml
            {{- else }}
            - /out
            - --duration
            - {{ .Values.audit.duration | quote }}
            {{- if .Values.audit.dryRun }}
            - --dry-run
            {{- end }}
            {{- end }}
            - --cilium-namespace
            - {{ .Values.ciliumNamespace | quote }}
            {{- range .Values.audit.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          volumeMounts:
            # Generated policy files (audit), missing-rules.yaml (verify) or
            # one <namespace>/<policy>.missing.yaml per policy (verify-all)
            # land here; pull them with
            #   kubectl -n {{ .Release.Namespace }} cp <pod>:/out ./netpol-out
            - name: out
              mountPath: /out
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: out
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
