target:
  # -- Label selecting which pods to watch, e.g. `app.kubernetes.io/name=my-app`. **Required** (unless `target.labels` is set), except with `audit.mode: verify-all`, where it must be empty.
  label: ""
  # -- More labels to audit in this same release, on top of `target.label` (`audit` mode only), e.g. `["app.kubernetes.io/name=frontend", "app.kubernetes.io/name=backend"]`. Each gets its own policy, as with one release per label, but they share one `hubble observe` stream per Cilium agent instead of one each.
  labels: []
  # -- Namespace to watch those pods in, and where the generated CiliumNetworkPolicy is written/deployed (a CNP only ever matches pods in its own namespace). **Required**, except with `audit.mode: verify-all`, where it optionally limits the check to one namespace.
  namespace: ""

audit:
  # -- `audit` builds a policy from observed traffic. `verify` is read-only: it
  # logs every flow the policy already deployed in target.namespace blocks, and
  # writes the rules to add to `/out/missing-rules.yaml`. `verify-all` does the
  # same for every policy at once (leave target.label empty), writing one
  # `/out/<namespace>/<policy>.missing.yaml` per policy missing rules.
  mode: audit
  # -- Seconds to watch per round. `audit` mode only.
  duration: 120
  # -- Preview the policy without deploying it. `audit` mode only.
  dryRun: false
  # -- Extra raw args passed to `cnpgen audit`/`cnpgen verify`, e.g. `["--allow-domain", "*.auth0.com"]`.
  extraArgs: []

image:
  # -- Image repository.
  repository: ghcr.io/kwistof/cnpgen
  # -- Image tag. Defaults to the chart's `appVersion`.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Namespace where the Cilium agent pods run, cnpgen execs into them. Since
# this chart runs `cnpgen audit` as a long-lived Deployment, expect one
# long-lived `hubble observe --follow` exec session per Cilium agent pod for
# the lifetime of this release (about 15 MB in each agent pod). To audit
# several apps at once, list them in target.labels (one stream for all), or
# install one release per app (one stream each); they can share a namespace.
ciliumNamespace: kube-system

rbac:
  # -- Create the ClusterRole/ClusterRoleBinding (manage CiliumNetworkPolicies) and Role/RoleBinding (exec into Cilium pods).
  create: true
  # -- With `audit.mode: verify` or `verify-all`, also let cnpgen list pods in
  # every namespace, to say which pod or node holds a blocked peer IP Cilium has
  # no identity for (or that none does: a stale IP). Pod objects include their
  # env values, so turn this off if that access is too broad; cnpgen then logs
  # those peers by IP only.
  lookupPodIPs: true

serviceAccount:
  # -- Create a ServiceAccount for the Job.
  create: true
  # -- ServiceAccount name. Empty uses the chart's fullname.
  name: ""

# -- Pod resource requests/limits.
resources: {}
# -- Pod node selector.
nodeSelector: {}
# -- Pod tolerations.
tolerations: []
# -- Pod affinity.
affinity: {}
