target:
  # -- Label selecting which pods to watch, e.g. `app.kubernetes.io/name=my-app`. **Required.**
  label: ""
  # -- Namespace to watch those pods in, and where the generated CiliumNetworkPolicy is written/deployed (a CNP only ever matches pods in its own namespace). **Required.**
  namespace: ""

audit:
  # -- `audit` builds a policy from observed traffic. `verify` is read-only: it
  # logs every flow the policy already deployed in target.namespace blocks, and
  # writes the rules to add to `/out/missing-rules.yaml`.
  mode: audit
  # -- Seconds to watch per round. `audit` mode only.
  duration: 120
  # -- Preview the policy without deploying it. `audit` mode only.
  dryRun: false
  # -- Extra raw args passed to `cnpgen audit`/`cnpgen verify`, e.g. `["--allow-domain", "*.auth0.com"]`.
  extraArgs: []

image:
  # -- Image repository.
  repository: ghcr.io/kwistof/cnpgen
  # -- Image tag. Defaults to the chart's `appVersion`.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Namespace where the Cilium agent pods run, cnpgen execs into them. Since
# this chart runs `cnpgen audit` as a long-lived Deployment, expect one
# long-lived `hubble observe --follow` exec session per Cilium agent pod for
# the lifetime of this release.
ciliumNamespace: kube-system

rbac:
  # -- Create the ClusterRole/ClusterRoleBinding (manage CiliumNetworkPolicies) and Role/RoleBinding (exec into Cilium pods).
  create: true

serviceAccount:
  # -- Create a ServiceAccount for the Job.
  create: true
  # -- ServiceAccount name. Empty uses the chart's fullname.
  name: ""

# -- Pod resource requests/limits.
resources: {}
# -- Pod node selector.
nodeSelector: {}
# -- Pod tolerations.
tolerations: []
# -- Pod affinity.
affinity: {}
